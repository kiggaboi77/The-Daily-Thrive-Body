<head>
<meta charset="utf-8">

<style>
:root{--navy:#0b3954;--teal:#087e8b;--sand:#f4efe6;--coral:#ff5a5f;--ink:#1c2b33;--card:#fff;--line:#d9e2e7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;background:var(--sand);color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem}
.lang button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 12px;border-radius:999px;cursor:pointer;margin-left:6px;font-size:.9rem}
.lang button.on{background:#fff;color:var(--navy);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:16px}
section{margin-bottom:26px}
h2{font-size:1.1rem;color:var(--navy);margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:.95rem;color:var(--ink)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.fish{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 12px;min-width:92px;border-radius:14px}
.fish .e{font-size:1.5rem}
.fish.on{background:var(--coral);border-color:var(--coral)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:1.05rem}
.muted{color:#5b6b73;font-size:.88rem}
.tag{display:inline-block;background:#e3f2f4;color:var(--navy);padding:2px 9px;border-radius:999px;font-size:.78rem;margin:2px 3px 0 0}
.stars{color:#f5a623;letter-spacing:1px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td{padding:4px 0;border-top:1px solid var(--line)}
td:last-child{text-align:right;font-weight:700}
.btns{display:flex;gap:8px;margin-top:auto}
button.act{flex:1;padding:10px;border-radius:10px;border:0;cursor:pointer;font-size:.95rem;font-weight:700}
.book{background:var(--coral);color:#fff}
.info{background:#e3f2f4;color:var(--navy)}
.rep{border-left:4px solid var(--teal)}
.rep a{color:var(--teal)}
.notice{background:#fff8e1;border:1px solid #f0d98a;padding:10px 12px;border-radius:10px;font-size:.85rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.open{display:flex}
.box{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:20px;position:relative}
.x{position:absolute;right:12px;top:8px;background:none;border:0;font-size:1.7rem;cursor:pointer}
.contact a{display:block;font-size:1.15rem;font-weight:700;color:var(--teal);margin:8px 0;word-break:break-all}
.review{border-top:1px solid var(--line);padding:8px 0}
footer{text-align:center;color:#5b6b73;font-size:.8rem;padding:20px}
</style>
</head>

</main>

    footer: "Barcos, precios, contactos y reseñas son datos de ejemplo. Sustituye por datos reales antes de usar.",
    k: { half: "Medio día", full: "Día completo", ext: "Extendido / noche", night: "Nocturno" },
    a: { rod: "Alquiler de caña", bait: "Carnada incluida", galley: "Cafetería", cabin: "Camarote", ice: "Hielo / nevera", ac: "A/C" } }
};

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} }
const $ = id => document.getElementById(id);
const state = { lang: store("lang") || "ko", region: "east", season: seasonOf(new Date()), fish: null, type: null, area: null };
function seasonOf(d) { const m = d.getMonth() + 1; return Object.keys(DATA.seasons).find(s => DATA.seasons[s].m.includes(m)); }
const t = () => UI[state.lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stars = n => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));
const fishName = f => f[state.lang];
const chip = (label, on, attr, extra = "") => `<button class="chip ${extra} ${on ? "on" : ""}" ${attr}>${label}</button>`;

function render() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t()[el.dataset.i]);
  $("lang").innerHTML = [["ko", "한국어"], ["en", "English"], ["es", "Español"]].map(([c, n]) => `<button class="${state.lang === c ? "on" : ""}" data-lang="${c}">${n}</button>`).join("");
  $("regions").innerHTML = Object.keys(DATA.regions).map(r => chip(DATA.regions[r][state.lang], state.region === r, `data-region="${r}"`)).join("");
  $("seasons").innerHTML = Object.keys(DATA.seasons).map(s => chip(DATA.seasons[s][state.lang], state.season === s, `data-season="${s}"`)).join("");

  const regionAreas = Object.keys(DATA.areas).filter(k => DATA.areas[k].region === state.region);
  if (state.area && !regionAreas.includes(state.area)) state.area = null;
  $("areaSec").style.display = regionAreas.length > 1 ? "" : "none";
  $("areas").innerHTML = chip(t().allAreas, !state.area, `data-area=""`) + regionAreas.map(k => chip(DATA.areas[k][state.lang], state.area === k, `data-area="${k}"`)).join("");
  const scope = state.area ? [state.area] : regionAreas;
  const fishById = Object.fromEntries(DATA.fish.map(f => [f.id, f]));
  const inSeasonIn = (id, area) => ((fishById[id] || { s: {} }).s[area] || []).includes(state.season);
  const inSeason = DATA.fish.filter(f => scope.some(k => inSeasonIn(f.id, k) && DATA.boats.some(b => b.area === k && b.fish.includes(f.id))));
  if (state.fish && !inSeason.some(f => f.id === state.fish)) state.fish = null;
  $("fish").innerHTML = chip(t().all, !state.fish, `data-fish=""`) + inSeason.map(f => chip(`<span class="e">${f.e}</span>${fishName(f)}`, state.fish === f.id, `data-fish="${f.id}"`, "fish")).join("");
  $("types").innerHTML = chip(t().all, !state.type, `data-type=""`) + Object.keys(DATA.types).map(k => chip(DATA.types[k][state.lang], state.type === k, `data-type="${k}"`)).join("");

  const boats = DATA.boats.filter(b => b.region === state.region && (!state.area || b.area === state.area) && (!state.type || b.type === state.type) &&
    (state.fish ? b.fish.includes(state.fish) && inSeasonIn(state.fish, b.area) : b.fish.some(id => inSeasonIn(id, b.area))));
  $("boats").innerHTML = boats.length ? boats.map(boatCard).join("") : `<p class="muted">${t().noBoat}</p>`;

  $("reports").innerHTML = DATA.reports.filter(r => r.region === state.region).map(r => `
    <div class="card rep"><div class="muted">${r.date}${r.tag ? ` · <b>${t().tag[r.tag]}</b>` : ""}</div>
    <div>${esc(r[state.lang])}</div><div class="muted">${t().source}: <a href="${r.url}" target="_blank" rel="noopener">${esc(r.src)}</a></div></div>`).join("");
}

function boatCard(b) {
  const unitFor = b.type === "charter" ? t().perBoat : t().perPerson;
  return `<div class="card"><h3>${esc(b.name)}</h3>
    <div class="muted">📍 ${esc(b.port)} · <span class="stars">${stars(b.rating)}</span> ${b.rating} (${b.reviews.length})</div>
    <div>${DATA.types[b.type][state.lang]}</div>
    <div>${b.fish.map(id => `<span class="tag">${fishName(DATA.fish.find(f => f.id === id))}</span>`).join("")}</div>
    <table>${b.trips.map(x => `<tr><td>${t().k[x.k]} · ${x.t}</td><td>$${x.p} <span class="muted">${unitFor}</span></td></tr>`).join("")}</table>
    <div class="btns"><button class="act info" data-info="${b.id}">${t().info}</button><button class="act book" data-book="${b.id}">${t().book}</button></div></div>`;
}

function openModal(html) { $("mbody").innerHTML = html; $("modal").classList.add("open"); }

function showInfo(b) {
  openModal(`<h2>${esc(b.name)}</h2><p class="muted">📍 ${esc(b.port)} · ${t().sample}</p>
    <p>${t().length}: ${b.length} ${t().ft} · ${t().cap}: ${b.cap} ${t().people}</p>
    <p><b>${t().amen}</b><br>${b.amen.map(a => `<span class="tag">${t().a[a]}</span>`).join("")}</p>
    <p><b>${t().fishes}</b><br>${b.fish.map(id => `<span class="tag">${fishName(DATA.fish.find(f => f.id === id))}</span>`).join("")}</p>
    <p><b>${t().reviews}</b> <span class="stars">${stars(b.rating)}</span> ${b.rating}</p>
    ${b.reviews.map(r => `<div class="review"><b>${esc(r.n)}</b> <span class="stars">${stars(r.s)}</span> <span class="muted">${r.d}</span><br>${esc(r.t)}</div>`).join("")}
    <div class="btns" style="margin-top:12px"><button class="act book" data-book="${b.id}">${t().book}</button></div>`);
}

function showBook(b) {
  const tel = b.phone.replace(/[^+\d]/g, "");
  openModal(`<h2>${t().bookTitle}</h2><h3>${esc(b.name)}</h3><p class="muted">${t().bookHint}</p>
    <div class="contact"><div>📞 ${t().call}</div><a href="tel:${tel}">${esc(b.phone)}</a>
    <div>✉️ ${t().mail}</div><a href="mailto:${esc(b.email)}?subject=${encodeURIComponent(b.name)}">${esc(b.email)}</a></div>
    <p class="muted">${t().sample}</p>`);
}

document.addEventListener("click", e => {
  const d = e.target.closest("button, .modal"); if (!d) return;
  const ds = d.dataset || {};
  if (d.id === "modal" || d.id === "close") return $("modal").classList.remove("open");
  if (ds.lang) { state.lang = ds.lang; store("lang", ds.lang); }
  else if ("area" in ds) { state.area = ds.area || null; state.fish = null; }
  else if (ds.region) { state.region = ds.region; state.fish = null; }
  else if (ds.season) { state.season = ds.season; }
  else if ("fish" in ds) { state.fish = ds.fish || null; }
  else if ("type" in ds) { state.type = ds.type || null; }
  else if (ds.info) return showInfo(DATA.boats.find(b => b.id === ds.info));
  else if (ds.book) return showBook(DATA.boats.find(b => b.id === ds.book));
  else return;
  render();
});
render();
</script>
</body>
</html>
